global:
  resolve_timeout: 5m

# Route tree - how alerts flow to receivers
route:
  # Default receiver (logs only - no external service needed)
  receiver: 'log-alerts'

  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'provider', 'team']

  # Wait before sending first notification for group
  group_wait: 30s

  # Wait before sending updated notification
  group_interval: 5m

  # Wait before resending same alert
  repeat_interval: 4h

# Inhibition rules - suppress lower severity when higher fires
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'provider']

receivers:
  # Default: just log (no external service)
  # Alerts visible in Alertmanager UI at http://localhost:9093
  - name: 'log-alerts'

